# The API plus the database you pick. Chroma needs no server, so it works with the API alone.
#
#   docker compose up api                       # VECTOR_DB=chroma (default)
#   docker compose --profile qdrant up          # then set VECTOR_DB=qdrant
#   docker compose --profile pgvector up        # then set VECTOR_DB=pgvector

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      PGVECTOR_URL: postgresql://postgres:postgres@pgvector:5432/rag
      CHROMA_PATH: /data/chroma
    volumes:
      - rag-data:/data
      - rag-files:/srv/app/assets/files

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: [qdrant]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:pg17
    profiles: [pgvector]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  rag-data:
  rag-files:
  qdrant-data:
  pg-data:
