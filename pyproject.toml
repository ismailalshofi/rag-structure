[project]
name = "rag-structure"
version = "1.0.0"
description = "A RAG API that runs on Chroma, Qdrant, pgvector or in memory: upload, index, search and cited answers with conversation memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "aiofiles>=24.1",
    "pymupdf>=1.24",
    "langchain-text-splitters>=0.3",
    "numpy>=1.26",
    "openai>=1.50",
]

[project.optional-dependencies]
# Install only what you use, e.g. pip install -e ".[fastembed,qdrant]"
fastembed = ["fastembed>=0.4"]
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.12"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
all = ["rag-structure[fastembed,chroma,qdrant,pgvector]"]
dev = ["rag-structure[all]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # package re-exports
